  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close categories">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="sidebar-group">
        <div class="sidebar-heading">Browse</div>
        <div class="sidebar-list" id="sidebar-browse"></div>
      </div>

      <div class="sidebar-group">
        <div class="sidebar-heading">Categories</div>
        <div class="sidebar-list" id="sidebar-categories"></div>
      </div>

      <div class="sidebar-footer">
        <a href="https://github.com/mtbcomnp" class="sidebar-ext" data-site-link="github" target="_blank" rel="noopener noreferrer">
          <span>GitHub</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <span>Contact</span>
        </a>

    <main class="vp-main">
      <div class="content-wrap">
        <div class="page-header">
          <h1 class="page-title" id="page-title">Resources</h1>
          <p class="page-sub" id="page-sub">Tools, add-ins, and downloads.</p>
        </div>

        <div class="mobile-pills" id="mobile-pills" aria-label="Category filter"></div>

        <div class="toolbar">
          <div class="toolbar-left">
            <span class="results-summary" id="results-summary"></span>
            <button type="button" class="link-btn" id="reset-filter-btn" hidden>Reset</button>
          </div>

          <div class="toolbar-right">
            <select id="sort-select" class="sort-select" aria-label="Sort resources">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="name">A–Z</option>
            </select>

            <div class="view-toggle" role="group" aria-label="Layout view">
              <button type="button" class="view-btn active" id="view-grid-btn" title="Grid view" aria-label="Grid view" aria-pressed="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
              </button>
              <button type="button" class="view-btn" id="view-list-btn" title="List view" aria-label="List view" aria-pressed="false">

                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="items-container view-grid" id="items-container"></div>

        <div class="empty-state" id="empty-state" hidden>
          <p>No items match this filter. <button type="button" class="link-btn" id="empty-reset-btn">Show all</button></p>
        </div>
      </div>

      <footer class="site-footer">
        <span>© <span id="footer-year"></span> <a href="https://mtb.com.np" id="footer-name">made with love &#10084;&#65039;</a></span>
      </footer>

  <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search resources" aria-hidden="true">

          <line x1="21" y1="21" x2="16.65" y2="16.65" />

        <input type="search" id="search-input" class="search-input" placeholder="Search tools, formats, tags…" autocomplete="off" spellcheck="false" />
        <button type="button" class="search-close" id="search-close" aria-label="Close search">
          <kbd class="kbd">Esc</kbd>
        </button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
